name: Lint Code

on:
  pull_request:

jobs:
  py-linting:
    name: Python Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install lint dependencies
        run: |
          # The lint toolset is declared as a PEP 735 dependency group, so
          # the workflow never pins tool versions in two places.
          uv pip install --system --group lint
      - name: Lint Python
        run: |
          black --check --diff .
